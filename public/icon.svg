<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="8-400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242438"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1"   stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Budget gauge: the same ring the app leads with, about two-thirds spent -->
  <g transform="rotate(135 96 96)">
    <circle cx="96" cy="96" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.10"
            stroke-width="15" stroke-linecap="round"
            stroke-dasharray="245 327"/>
    <circle cx="96" cy="96" r="52" fill="none" stroke="url(#arc)"
            stroke-width="15" stroke-linecap="round"
            stroke-dasharray="167 327"/>
  </g>

  <!-- Needle resting at the end of the filled arc -->
  <g transform="rotate(50 96 96)">
    <rect x="93" y="52" width="6" height="30" rx="3" fill="#f2f0fa"/>
  </g>
  <circle cx="96" cy="96" r="8.5" fill="#f2f0fa"/>
  <circle cx="96" cy="96" r="3.5" fill="#14142a"/>
</svg>
